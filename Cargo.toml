[package]
name = "agent-terminal"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
description = "Agent-native terminal job control backed by Zellij"
exclude = ["/opencode/node_modules/**", "/opencode/coverage/**", "/target/**"]

[[test]]
name = "zellij_e2e"
path = "tests/zellij_e2e/mod.rs"

[[test]]
name = "recovery_contract"
path = "tests/recovery_contract/mod.rs"

[dependencies]
blake3 = "1"
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
wait-timeout = "0.2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused_imports = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
